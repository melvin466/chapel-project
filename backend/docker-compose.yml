version: '3.8'

services:
  backend:
    build: .
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BASE_URL=${BASE_URL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Chapel Management}
      - PAYMENT_CALLBACK_SECRET=${PAYMENT_CALLBACK_SECRET}
      - PESAPAL_ENVIRONMENT=${PESAPAL_ENVIRONMENT:-sandbox}
      - PESAPAL_API_BASE_URL=${PESAPAL_API_BASE_URL}
      - PESAPAL_CONSUMER_KEY=${PESAPAL_CONSUMER_KEY}
      - PESAPAL_CONSUMER_SECRET=${PESAPAL_CONSUMER_SECRET}
      - PESAPAL_IPN_ID=${PESAPAL_IPN_ID}
      - PESAPAL_CALLBACK_URL=${PESAPAL_CALLBACK_URL}
      - PESAPAL_CANCELLATION_URL=${PESAPAL_CANCELLATION_URL}
      - PESAPAL_BRANCH=${PESAPAL_BRANCH}
      - MTN_API_URL=${MTN_API_URL}
      - MTN_API_KEY=${MTN_API_KEY}
      - AIRTEL_API_URL=${AIRTEL_API_URL}
      - AIRTEL_API_KEY=${AIRTEL_API_KEY}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - UPLOAD_MAX_FILE_SIZE_MB=${UPLOAD_MAX_FILE_SIZE_MB:-100}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:-chapel-system}
    restart: always
