services:
  - type: web
    name: chapel-system-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 1d
      - key: REQUIRE_EMAIL_VERIFICATION
        value: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://chapel-system-web.onrender.com
      - key: CORS_ORIGINS
        value: https://chapel-system-web.onrender.com
      - key: BASE_URL
        value: https://chapel-system-api.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Chapel Management
      - key: PESAPAL_ENVIRONMENT
        value: production
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_ID
        value: 6a406275-e3c3-4522-a990-da5619e20645
      - key: PESAPAL_CALLBACK_URL
        value: https://chapel-system-api.onrender.com/api/donations/callback
      - key: PESAPAL_CANCELLATION_URL
        value: https://chapel-system-web.onrender.com/donations
      - key: DONATION_PAYMENT_PROVIDER
        value: pesapal
      - key: RELWORX_API_BASE_URL
        value: https://payments.relworx.com/api
      - key: RELWORX_API_KEY
        sync: false
      - key: RELWORX_ACCOUNT_NO
        sync: false
      - key: RELWORX_WEBHOOK_KEY
        sync: false
      - key: TRUST_PROXY
        value: 1
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: UPLOAD_MAX_FILE_SIZE_MB
        value: 100
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: chapel-system
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        sync: false
      - key: ADMIN_LAST_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false

  - type: web
    name: chapel-system-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://chapel-system-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
